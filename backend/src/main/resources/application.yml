server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: aurelia-ecommerce
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aurelia_ecommerce}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:9a82f41c6d3b4e5f7a8c9b0e1d2c3b4a5f6e7d8c9b0a1f2e3d4c5b6a7f8e9d0c}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost:3000}
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
    admin-password: ${ADMIN_DEV_PASSWORD:Admin@12345}
